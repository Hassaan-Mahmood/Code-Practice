<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>

    <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">School Management</div>
    <div class="user">Admin</div>
  </nav>

  <!-- Sidebar -->
  <aside class="sidebar">
    <h3>Management</h3>

    <a href="index.html" class="active">
      🎓 Student
    </a>

    <a href="teacher.html">
      👨‍🏫 Teacher
    </a>

    <a href="class.html">
      📚 Class
    </a>
  </aside>

  <!-- Main Content -->
  <main class="main">
    <h1>Dashboard</h1>

    <div class="cards">

      <section class="card" id="student">
        <h2>Student</h2>

      </section>

      <section class="card" id="teacher">
        <h2>Teacher</h2>

      </section>

      <section class="card" id="class">
        <h2>Class</h2>
   
      </section>

    </div>
  </main>




    <div class="container">
      <!-- Button -->
      <div class="top-bar">
        <button class="add-btn" onclick="openModal()">+ Add Student</button>
      </div>

      <!-- Table -->
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Age</th>
            <th>Education</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="userTable">
          
        </tbody>
      </table>
    </div>

    

    <!-- Modal -->
    <div class="modal" id="userModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add Student</h2>

          <span class="close" onclick="closeModal()"> &times; </span>
        </div>

        <form>
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="name" placeholder="Enter name" required />
          </div>

          <div class="form-group">
            <label>Age</label>
            <input type="number" id="age" placeholder="Enter age" required />
          </div>

          <div class="form-group">
            <label>Education</label>
            <input
              type="text"
              id="education"
              placeholder="Enter education"
              required
            />
          </div>

          <button type="button" class="save-btn" onclick="saveStudent()">
            Save Student
          </button>
        </form>
      </div>
    </div>



    <script src="global.js"></script>
    <script src="app.js"></script>
  </body>
</html>
